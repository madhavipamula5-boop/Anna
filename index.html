<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For My Annayaaaaaaaaaaa❤️</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        .cartoon {
            font-size: 60px;
            margin-bottom: 20px;
        }
        h2 { color: #e91e63; margin-bottom: 20px; }
        button {
            background: #e91e63;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-size: 16px;
            margin: 10px;
            cursor: pointer;
            transition: 0.3s;
        }
        button:hover { transform: scale(1.05); }
        #NoThanksBtn { position: absolute; }
        .hidden { display: none; }
        .photo { width: 100%; border-radius: 15px; margin: 15px 0; }
        .caption { color: #555; font-style: italic; margin-bottom: 20px; }
        input {
            padding: 10px;
            width: 70%;
            border: 2px solid #e91e63;
            border-radius: 20px;
            margin: 10px 0;
            text-align: center;
        }
        .confetti {
            position: fixed;
            width: 10px;
            height: 10px;
            background: #e91e63;
            animation: fall 3s linear infinite;
        }
        @keyframes fall {
            to { transform: translateY(100vh) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>
    <!-- Step 1: Valentine Question -->
    <div class="card" id="step1">
        <div class="cartoon">👫💕</div>
        <h2>Happy Birthday</h2>
        <h2>Nanna</h2>
        <h2>Try to click NoThanks</h2>
        <button id="Thank YouBtn">Thank You</button>
        <button id="NoThanksBtn">NoThanks</button>
        <p style="font-size:12px; margin-top:15px;">Don't waste your time to follow the No Thanks😜</p>
    </div>

    <!-- Step 2: After Thank You -->
    <div class="card hidden" id="step2">
        <div class="cartoon">🥰💕</div>
        <h2>Yaaahhh! Successfully Completed 25 Years</h2>
        <p>I want to show you some special moments of yours ❤️</p>
        <button onclick="showPhotos()">See the moments</button>
    </div>

    <!-- Step 3: Photos Gallery -->
    <div class="card hidden" id="step3">
        <div id="photoContainer"></div>
        <button onclick="nextPhoto()">Next ❤️</button>
    </div>

    <!-- Step 4: Love Letter -->
    <div class="card hidden" id="step4">
        <h2>Hey Rishi ❤️</h2>
        <p>Type <b>"Always Be Happy"</b> to unlock surprise letter</p>
        <input type="text" id="loveInput" placeholder="Type here...">
        <br>
        <button onclick="checkLove()">Submit ❤️</button>
        <p id="errorMsg" style="color:red; font-size:14px;"></p>
    </div>

    <!-- Step 5: Final Letter -->
    <div class="card hidden" id="step5">
        <div style="font-size:40px;">💌🌹</div>
        <h2>Naa Annayaa Ki Oka Prema Lekaaaaa</h2>
        <p id="letterText" style="text-align:left; line-height:1.6;"></p>
    </div>

<script>
    // Step 1: NoThanks button run away logic
    const NoThanksBtn = document.getElementById('NoThanksBtn');
    NoThanksBtn.addEventListener('mouseover', () => {
        const x = Math.random() * (window.innerWidth - 100);
        const y = Math.random() * (window.innerHeight - 50);
        NoThanksBtn.style.left = x + 'px';
        NoThanksBtn.style.top = y + 'px';
    });

    document.getElementById('Thank YouBtn').onclick = () => {
        document.getElementById('step1').classList.add('hidden');
        document.getElementById('step2').classList.remove('hidden');
        createConfetti();
    };

    // Step 2: Confetti
    function createConfetti() {
        for(let i=0; i<50; i++) {
            let conf = document.createElement('div');
            conf.className = 'confetti';
            conf.style.left = Math.random()*100 + 'vw';
            conf.style.background = `hsl(${Math.random()*360},100%,50%)`;
            conf.style.animationDelay = Math.random()*3 + 's';
            document.body.appendChild(conf);
            setTimeout(() => conf.remove(), 3000);
        }
    }

    // Step 3: Photos - nee photos links ikkada petuko
    const photos = [
        {img: 'https://i.ibb.co/GQtfhrYD/Your-Childhood-Pic-html.jpg', cap: 'Your Childhood Pic : "First time ninnu chusina amma face lo haa happiness yeppatiki marchipodhu,ni memories anni gurtuku ravali nanna". "Happy Birthday Anna"  😍'},
        {img: 'https://i.ibb.co/byJykpQ/Your-Cricket-Pic-html.jpg', cap: 'Your Cricket Pic : "Nuvvu bat pattina preti sari six kottali ani korukuntunna nanna". "Happy Birthday Anna" 💕'},
        {img: 'https://i.ibb.co/XxCTSG4W/Your-Family-Pic-html.jpg', cap: 'Your Family Pic : "Prapancham motham oka vaipu unna amma nanna yeppudu nitho ne untaru". Amma Nanna side nunchi "Happy Birthday Betta" 💖'},
        {img: 'https://i.ibb.co/LdrXTkKd/Your-Strength-Pic-html.jpg', cap: 'Your Strength Pic : "Anna ante oka blood relation ye kadu oka friend gaa, oka care taker gaa,oka well wisher gaa, yeppudu nitho ne untaru nuvvu tappu chesina correct chesina ni side ye untadu. "Happy Birthday Anna" ✨'},
        {img: 'https://i.ibb.co/RGM8f2bM/Your-Cousins-Pic-html.jpg', cap: 'Your Cousin Pic : "Oka okaru oka chota unna mi relation yeppudu illane untadi valla side nunchi". "Happy Birthday Bhaiii" 💕'},
        {img: 'https://i.ibb.co/YTPns62z/Your-Frist-Pic-In-Instagram-html.jpg', cap: 'Your Frist Pic In Instragram :  "First Post kadu first Impression". "Happy Birthday Anna" 😍'},
        {img: 'https://i.ibb.co/DgjVRhPk/Your-College-Days-Pic-html.jpg', cap: 'Your College Days Pics : "College ayyipoyina mi friendship ippatiki allane undi future lo kuda illane undalani korukuntunna valla side nunchi". "Happy Birthday Raa Mamaaaaa" 💕'},
        {img: 'https://i.ibb.co/zhwCK1N4/Your-Beach-Pic-html.jpg', cap: 'Your Beach Pic : "Beach lo alalu sound vinte yentha happy ga untundo ni SMILE chusina anthe happy ga untundi nanna". "Happy Birthday Anna" ❤️'},
        {img: 'https://i.ibb.co/LXdWxKRy/Your-Frist-Pic-In-Aha-Company-html.jpg', cap: 'Your First Pic In Aha Company : "New Journey,new dreams.....Aha Moment!". "Happy Birthday Anna" 💕'},
        {img: 'https://i.ibb.co/tMM16rs1/Your-Fav-Pic-html.jpg', cap: 'Your Fav Pic : "Ni fav pic nanna ammai kavali ammai kavali ani antunav gaa tisuko enjoy the day". "Happy Birthday Anna" 😍'},
        {img: 'https://i.ibb.co/5gbyMGhG/Your-Latest-Pic-html.jpg', cap: 'Your Latest Pic : "Updated Version.....Rishi 2.0" ✨'},
        {img: 'https://i.ibb.co/vvJr1tSy/Your-Sister-Pic-html.jpg', cap: 'Your Sister Pic : "Last but not least presenting ur sister "Madhavi" alis "Chitti Talli" ee pic nenu ni kosam kastapadi mi ooriki vachi suprise icha appudu ni face lo ha smile ippatiki gurtuku undi yeppudu illane navvutu undu nanna". "Happy Birthday Annaluuuuuuuuuu" 💕'}
    ];
    let currentPhoto = 0;

    function showPhotos() {
        document.getElementById('step2').classList.add('hidden');
        document.getElementById('step3').classList.remove('hidden');
        showPhoto();
    }

    function showPhoto() {
        const container = document.getElementById('photoContainer');
        container.innerHTML = `
            <img src="${photos[currentPhoto].img}" class="photo">
            <p class="caption">${photos[currentPhoto].cap}</p>
        `;
    }

    function nextPhoto() {
        currentPhoto++;
        if(currentPhoto < photos.length) {
            showPhoto();
        } else {
            document.getElementById('step3').classList.add('hidden');
            document.getElementById('step4').classList.remove('hidden');
        }
    }

    // Step 4: Naa Annayaa Ki Oka Prema Lekaaaaa
     function checkLove() {
        const input = document.getElementById('loveInput').value.trim().toLowerCase();
        if(input === 'always be happy') {
            document.getElementById('step4').classList.add('hidden');
            document.getElementById('step5').classList.remove('hidden');
            typeLetter();
        } else {
            document.getElementById('errorMsg').innerText = '😜 Nope! Type properly guys!';
        }
    }

    // Step 5: Typing effect love letter
    function typeLetter() {
        const text = `Dear Annayaaaaaaaaaaaaaa.........
                           Anna ante just oka relation kadu,naa life lo naku dorikina oka beautiful blessing.Nenu entha pedda problem lo unna,natho undi dhairyam cheppe person nuvve. Naa happiness lo na kante yekkuva happy ayye heart,naa badha lo natho patu feel ayye manasu nee degara undi. Okasari mana madhya chala distance vachindi appudu nuvvu ela unnav emo kani natho asalu avvaledu,mana madhya inko sari 3rd person rakudadu ani korukuntunna nanna.Nuvvu naku anna gaa undadam ante adi naa luck ani nenu anukuntanu. Nee smile yeppudu allane undali ,Ni Life lo happiness tappa vere emi undakudadu ani korukuntunna.Life lo yenni relationships vachina,Anna-Chelli bonding lanti pure bond malli dorakadhu.Ippati nunchi yeppudu yedi jarigina,nee meda naa love,respect yeppatiki taggavu.Love You Sooooooooooo Much Annayaaaaaaaaa. Yeppatiki nuvvu bagundu nannu baga chusuko chalu.
                         Yeppudu ni manchi korukune ni "Chitti Talli".  Ee website chusaka TQ chitti talli ani chepu nanna .Nuvvu chitti talli ante vinnalani undi Nanna❤️`;
        let i = 0;
        const speed = 40;
        function typing() {
            if (i < text.length) {
                document.getElementById('letterText').innerHTML += text.charAt(i);
                i++;
                setTimeout(typing, speed);
            }
        }
        typing();
    }
</script>
</body>
</html>
